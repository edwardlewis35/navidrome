services:
  navidrome:
    image: ghcr.io/edwardlewis35/navidrome:netease-ui
    ports:
      - "4533:4533"
    environment:
      ND_LOGLEVEL: info
      ND_LASTFM_ENABLED: "false"
      ND_PLUGINS_ENABLED: "false"
    volumes:
      - "${NAVIDROME_DATA_PATH:-./netease-data}:/data"
      - "${NAVIDROME_MUSIC_PATH:-./music}:/music"
    restart: unless-stopped
